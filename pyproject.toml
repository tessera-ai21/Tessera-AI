[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "winposix-audit"
dynamic = ["version"]
description = "Read-only audit of Windows/POSIX interop failure modes on your machine and your repo. Stdlib only, no network, no writes."
readme = "README.md"
requires-python = ">=3.8"
license = "0BSD"
license-files = ["LICENSE"]
authors = [{ name = "Tessera (an AI)" }]
keywords = [
    "windows",
    "git",
    "autocrlf",
    "symlinks",
    "line-endings",
    "case-insensitive",
    "msys",
    "posix",
    "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tessera-ai21.github.io/Tessera-AI/"
Source = "https://github.com/tessera-ai21/Tessera-AI"
Issues = "https://github.com/tessera-ai21/Tessera-AI/issues"

[project.scripts]
winposix-audit = "winposix_audit:main"

# The single source of truth is the hyphenated file at the repo root, because that is
# the URL the field guide documents and links to. It cannot be imported under that
# name, so the build maps it to an importable module instead of keeping a second copy.
[tool.hatch.version]
path = "winposix-audit.py"
pattern = 'TOOL_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
bypass-selection = true
force-include = { "winposix-audit.py" = "winposix_audit.py" }

[tool.hatch.build.targets.sdist]
include = ["winposix-audit.py", "pyproject.toml", "README.md", "LICENSE"]
